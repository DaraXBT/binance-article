name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.E2E_BASE_URL != '' && vars.E2E_BASE_URL || 'http://127.0.0.1:3100' }}
      GOOGLE_CLIENT_ID: e2e-google-client
      GOOGLE_CLIENT_SECRET: e2e-google-secret
      GEMINI_API_KEY: e2e-not-used
      E2E_SEED_AUTH: ${{ secrets.E2E_DATABASE_URL != '' && secrets.E2E_BETTER_AUTH_SECRET != '' && '1' || '0' }}
      E2E_AUTHENTICATED: ${{ secrets.E2E_DATABASE_URL != '' && secrets.E2E_BETTER_AUTH_SECRET != '' && '1' || '0' }}
      E2E_STORAGE_STATE: .playwright/.auth/user.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: npm ci

      - name: Verify reproducible release tree
        run: npm run release:tree-check

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Typecheck web application
        run: npm run typecheck

      - name: Typecheck Cloudflare workflow
        run: npm run workflow:typecheck

      - name: Test
        run: npm run test

      - name: Install publisher companion dependencies
        run: bun install --frozen-lockfile
        working-directory: publisher-companion

      - name: Test and typecheck publisher companion
        run: bun test && bun run typecheck
        working-directory: publisher-companion

      - name: Build publisher companion artifact
        run: npm run publisher:package

      - name: Install Binance skill dependencies
        run: bun install --frozen-lockfile
        working-directory: .agents/skills/baoyu-post-to-binance-square/scripts

      - name: Test Binance skill
        run: bun test && npx tsc -p tsconfig.typecheck.json
        working-directory: .agents/skills/baoyu-post-to-binance-square/scripts

      - name: Install X skill dependencies
        run: bun install --frozen-lockfile
        working-directory: .agents/skills/baoyu-post-to-x/scripts

      - name: Test X skill
        run: bun test
        working-directory: .agents/skills/baoyu-post-to-x/scripts

      - name: Dry-run Cloudflare workflow
        run: npm run workflow:dry-run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply migrations to dedicated E2E PostgreSQL
        if: env.E2E_SEED_AUTH == '1'
        run: npm run db:migrate:deploy

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Validate Drizzle migrations
        run: npm run db:check
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xarticle
