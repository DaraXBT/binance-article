name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # Every authenticated run uses the same disposable E2E database. Serialize
  # all refs so two runs cannot reset each other's deterministic fixtures. A
  # trusted master push may cancel an in-progress PR so release CI is not
  # starved. GitHub can still replace any older pending run in a concurrency
  # group, so the release checklist requires green CI for the exact final SHA.
  group: ${{ github.workflow }}-shared-e2e-database
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.E2E_BASE_URL != '' && vars.E2E_BASE_URL || 'http://127.0.0.1:3100' }}
      GOOGLE_CLIENT_ID: e2e-google-client
      GOOGLE_CLIENT_SECRET: e2e-google-secret
      ENROLLMENT_CODE_PEPPER: ci-only-enrollment-code-pepper-at-least-32-characters
      GEMINI_API_KEY: e2e-not-used
      E2E_SEED_AUTH: ${{ secrets.E2E_DATABASE_URL != '' && secrets.E2E_BETTER_AUTH_SECRET != '' && '1' || '0' }}
      E2E_AUTHENTICATED: ${{ secrets.E2E_DATABASE_URL != '' && secrets.E2E_BETTER_AUTH_SECRET != '' && '1' || '0' }}
      E2E_ENROLLMENT_MUTATIONS: ${{ secrets.E2E_DATABASE_URL != '' && secrets.E2E_BETTER_AUTH_SECRET != '' && vars.E2E_BASE_URL == '' && '1' || '0' }}
      E2E_STORAGE_STATE: .playwright/.auth/user.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: npm ci

      - name: Verify reproducible release tree
        run: npm run release:tree-check

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Typecheck web application
        run: npm run typecheck

      - name: Typecheck Cloudflare workflow
        run: npm run workflow:typecheck

      # Shape-validates the deploy env contract with CI-only synthetic values
      # so drift in scripts/check-runtime-env.mjs surfaces before a release.
      - name: Validate runtime environment contract
        run: npm run env:check -- --target all
        env:
          DATABASE_URL: postgresql://ci:ci@db.example.invalid/xarticle?sslmode=require
          BETTER_AUTH_SECRET: ci-only-synthetic-secret-at-least-32-chars
          BETTER_AUTH_URL: https://app.example.invalid
          GOOGLE_CLIENT_ID: ci-client-id
          GOOGLE_CLIENT_SECRET: ci-client-secret
          ENROLLMENT_CODE_PEPPER: ci-only-enrollment-code-pepper-at-least-32-characters
          GEMINI_API_KEY: ci-gemini-key
          AI_CREDENTIAL_KEYRING: '{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
          AI_CREDENTIAL_ACTIVE_KEY_ID: v1

      - name: Install publisher companion dependencies
        run: bun install --frozen-lockfile
        working-directory: publisher-companion

      # The root artifact tests load the extracted companion and link these
      # installed dependency trees, so all three installs must precede them.
      - name: Install Binance skill dependencies
        run: bun install --frozen-lockfile
        working-directory: .agents/skills/baoyu-post-to-binance-square/scripts

      - name: Install X skill dependencies
        run: bun install --frozen-lockfile
        working-directory: .agents/skills/baoyu-post-to-x/scripts

      - name: Test
        run: npm run test

      # Two companion suites launch Chromium directly, and the same browser
      # installation is reused by the later Playwright E2E suite.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test and typecheck publisher companion
        run: bun test && bun run typecheck
        working-directory: publisher-companion

      - name: Build publisher companion artifact
        run: npm run publisher:package

      - name: Test Binance skill
        run: bun test && npx tsc -p tsconfig.typecheck.json
        working-directory: .agents/skills/baoyu-post-to-binance-square/scripts

      - name: Test X skill
        run: bun test
        working-directory: .agents/skills/baoyu-post-to-x/scripts

      - name: Dry-run Cloudflare workflow
        run: npm run workflow:dry-run

      - name: Apply migrations to dedicated E2E PostgreSQL
        if: env.E2E_SEED_AUTH == '1'
        run: npm run db:migrate:deploy

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}

      # failure() only: uploading reports for green runs burned the private
      # repo's free Actions storage allowance for no diagnostic value.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Full OpenNext build + wrangler dry-run + compressed-size gate. The
      # Worker once outgrew the free-plan 3 MiB limit with nobody noticing
      # because this gate only ran by hand; it must stay in CI.
      - name: Build and check Worker bundle size
        run: npm run cloudflare:dry-run

      # drizzle-kit check is file-only; the URL is never dialed (there is no
      # Postgres service in this job) and exists to mirror the operator shape.
      - name: Validate Drizzle migrations
        run: npm run db:check
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xarticle
