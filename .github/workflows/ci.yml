name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install Binance skill dependencies
        run: bun install --frozen-lockfile
        working-directory: .agents/skills/baoyu-post-to-binance-square/scripts

      - name: Test Binance skill
        run: bun test && npx tsc -p tsconfig.typecheck.json
        working-directory: .agents/skills/baoyu-post-to-binance-square/scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Binance export E2E
        run: npx playwright test e2e/binance-export.spec.ts

      - name: Build
        run: npm run build

      - name: Validate Prisma Migrations
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code
